name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows MSVC
            os: windows-latest
            generator: Ninja
            c_compiler: cl
            cxx_compiler: cl
          - name: Linux GCC
            os: ubuntu-latest
            generator: Ninja
            c_compiler: gcc
            cxx_compiler: g++
          - name: macOS Clang
            os: macos-latest
            generator: Ninja
            c_compiler: clang
            cxx_compiler: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        env:
          CC: ${{ matrix.config.c_compiler }}
          CXX: ${{ matrix.config.cxx_compiler }}
        run: >
          cmake -S . -B build
          -G "${{ matrix.config.generator }}"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release --timeout 60
